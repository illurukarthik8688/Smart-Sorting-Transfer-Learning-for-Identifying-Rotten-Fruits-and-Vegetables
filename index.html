<!DOCTYPE html>
<html>
<head>
    <title>Smart Sorting 🍎</title>
    <style>
  body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding: 40px;
    background: linear-gradient(#e0f7fa, #ffffff);
  }
  h1 {
    color: #00695c;
    font-size: 2.5rem;
    margin-bottom: 10px;
  }
  form {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: inline-block;
  }
  input[type=file] {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  button {
    background-color: #00796b;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background-color: #004d40;
  }
  img {
    margin-top: 20px;
    max-width: 300px;
    border-radius: 8px;
    border: 2px solid #ccc;
  }
  h2 {
    margin-top: 20px;
    color: #004d40;
  }
</style>
</head>
<body>
    <h1>🍎 Smart Sorting AI</h1>
    <h3>Upload an apple image to predict freshness</h3>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required><br>
        <button type="submit">Upload & Predict</button>
    </form>

    {% if result %}
        <h2>Result: {{ result }}</h2>
        <img src="{{ filename }}" alt="Uploaded Image">
    {% endif %}
</body>
</html>
